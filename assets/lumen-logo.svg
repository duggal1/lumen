<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#E94FD8"/>
      <stop offset="55%" stop-color="#D81FBF"/>
      <stop offset="100%" stop-color="#A41293"/>
    </radialGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7AEC"/>
      <stop offset="100%" stop-color="#FF4FE3"/>
    </linearGradient>
  </defs>
  <!-- badge -->
  <circle cx="128" cy="128" r="118" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="#8E0C7E" stroke-width="6" opacity="0.35"/>
  <!-- cheerful sun / city spark: warm white dome + three rays -->
  <g fill="#FFFFFF">
    <path d="M74 168a54 54 0 0 1 108 0z"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="13" stroke-linecap="round">
    <line x1="128" y1="60" x2="128" y2="88"/>
    <line x1="82" y1="80" x2="98" y2="98"/>
    <line x1="174" y1="80" x2="158" y2="98"/>
  </g>
  <!-- the "L" sweep: fuchsia glow bar across the sun -->
  <rect x="70" y="158" width="116" height="14" rx="7" fill="url(#spark)"/>
  <!-- little window sparkles (fuchsia cutouts in the white dome) -->
  <circle cx="103" cy="142" r="6" fill="#D81FBF"/>
  <circle cx="128" cy="130" r="6" fill="#D81FBF"/>
  <circle cx="153" cy="142" r="6" fill="#D81FBF"/>
</svg>
