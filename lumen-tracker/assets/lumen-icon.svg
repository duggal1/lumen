<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" shape-rendering="crispEdges">
  <title>Lumen</title>
  <defs>
    <!-- Original silhouette -->
    <clipPath id="shape">
      <path d="M288 224h32v32h-32zM288 256h64v32h-64zM288 288h96v32h-96zM288 320h128v32h-128zM288 352h160v32h-160zM288 384h192v32h-192zM288 416h224v32h-224zM288 448h256v32h-256zM288 480h288v32h-288zM288 512h320v32h-320zM288 544h352v32h-352zM288 576h384v32h-384zM288 608h416v32h-416zM288 640h256v32h-256zM288 672h128v32h-128zM448 672h128v32h-128zM288 704h96v32h-96zM480 704h96v32h-96zM288 736h64v32h-64zM480 736h128v32h-128zM288 768h32v32h-32zM512 768h96v32h-96zM512 800h128v32h-128zM544 832h32v32h-32z"/>
    </clipPath>

    <!-- 4x4 Bayer, 8px pixels. Each pattern is the previous one plus two pixels (2/16 to 14/16). -->
    <pattern id="p2" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="#fff" d="M0 0h8v8h-8zM16 16h8v8h-8z"/></pattern>
    <pattern id="p4" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="#fff" d="M0 0h8v8h-8zM16 16h8v8h-8zM16 0h8v8h-8zM0 16h8v8h-8z"/></pattern>
    <pattern id="p6" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="#fff" d="M0 0h8v8h-8zM16 16h8v8h-8zM16 0h8v8h-8zM0 16h8v8h-8zM8 8h8v8h-8zM24 24h8v8h-8z"/></pattern>
    <pattern id="p8" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="#fff" d="M0 0h8v8h-8zM16 16h8v8h-8zM16 0h8v8h-8zM0 16h8v8h-8zM8 8h8v8h-8zM24 24h8v8h-8zM24 8h8v8h-8zM8 24h8v8h-8z"/></pattern>
    <pattern id="p10" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="#fff" d="M0 0h8v8h-8zM16 16h8v8h-8zM16 0h8v8h-8zM0 16h8v8h-8zM8 8h8v8h-8zM24 24h8v8h-8zM24 8h8v8h-8zM8 24h8v8h-8zM8 0h8v8h-8zM24 16h8v8h-8z"/></pattern>
    <pattern id="p12" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="#fff" d="M0 0h8v8h-8zM16 16h8v8h-8zM16 0h8v8h-8zM0 16h8v8h-8zM8 8h8v8h-8zM24 24h8v8h-8zM24 8h8v8h-8zM8 24h8v8h-8zM8 0h8v8h-8zM24 16h8v8h-8zM24 0h8v8h-8zM8 16h8v8h-8z"/></pattern>
    <pattern id="p14" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="#fff" d="M0 0h8v8h-8zM16 16h8v8h-8zM16 0h8v8h-8zM0 16h8v8h-8zM8 8h8v8h-8zM24 24h8v8h-8zM24 8h8v8h-8zM8 24h8v8h-8zM8 0h8v8h-8zM24 16h8v8h-8zM24 0h8v8h-8zM8 16h8v8h-8zM0 8h8v8h-8zM16 24h8v8h-8z"/></pattern>

    <mask id="m2" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="url(#p2)"/></mask>
    <mask id="m4" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="url(#p4)"/></mask>
    <mask id="m6" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="url(#p6)"/></mask>
    <mask id="m8" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="url(#p8)"/></mask>
    <mask id="m10" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="url(#p10)"/></mask>
    <mask id="m12" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="url(#p12)"/></mask>
    <mask id="m14" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="url(#p14)"/></mask>
  </defs>

  <g clip-path="url(#shape)">
    <!-- Base: orange -->
    <rect x="0" y="0" width="1024" height="1024" fill="#ff5900"/>

    <!-- orange -> pink -->
    <g fill="#e63392">
      <polygon mask="url(#m2)"  points="560,0 1024,0 1024,1024 0,1024 0,560"/>
      <polygon mask="url(#m4)"  points="584,0 1024,0 1024,1024 0,1024 0,584"/>
      <polygon mask="url(#m6)"  points="608,0 1024,0 1024,1024 0,1024 0,608"/>
      <polygon mask="url(#m8)"  points="632,0 1024,0 1024,1024 0,1024 0,632"/>
      <polygon mask="url(#m10)" points="656,0 1024,0 1024,1024 0,1024 0,656"/>
      <polygon mask="url(#m12)" points="680,0 1024,0 1024,1024 0,1024 0,680"/>
      <polygon mask="url(#m14)" points="704,0 1024,0 1024,1024 0,1024 0,704"/>
      <polygon points="728,0 1024,0 1024,1024 0,1024 0,728"/>
    </g>

    <!-- pink -> violet -->
    <g fill="#834bec">
      <polygon mask="url(#m2)"  points="788,0 1024,0 1024,1024 0,1024 0,788"/>
      <polygon mask="url(#m4)"  points="812,0 1024,0 1024,1024 0,1024 0,812"/>
      <polygon mask="url(#m6)"  points="836,0 1024,0 1024,1024 0,1024 0,836"/>
      <polygon mask="url(#m8)"  points="860,0 1024,0 1024,1024 0,1024 0,860"/>
      <polygon mask="url(#m10)" points="884,0 1024,0 1024,1024 0,1024 0,884"/>
      <polygon mask="url(#m12)" points="908,0 1024,0 1024,1024 0,1024 0,908"/>
      <polygon mask="url(#m14)" points="932,0 1024,0 1024,1024 0,1024 0,932"/>
      <polygon points="956,0 1024,0 1024,1024 0,1024 0,956"/>
    </g>

    <!-- violet -> blue -->
    <g fill="#6298ea">
      <polygon mask="url(#m2)"  points="1016,0 1024,0 1024,1024 0,1024 0,1016"/>
      <polygon mask="url(#m4)"  points="1024,16 1024,1024 16,1024"/>
      <polygon mask="url(#m6)"  points="1024,40 1024,1024 40,1024"/>
      <polygon mask="url(#m8)"  points="1024,64 1024,1024 64,1024"/>
      <polygon mask="url(#m10)" points="1024,88 1024,1024 88,1024"/>
      <polygon mask="url(#m12)" points="1024,112 1024,1024 112,1024"/>
      <polygon mask="url(#m14)" points="1024,136 1024,1024 136,1024"/>
      <polygon points="1024,160 1024,1024 160,1024"/>
    </g>

    <!-- blue -> cyan -->
    <g fill="#a5e1ee">
      <polygon mask="url(#m2)"  points="1024,220 1024,1024 220,1024"/>
      <polygon mask="url(#m4)"  points="1024,244 1024,1024 244,1024"/>
      <polygon mask="url(#m6)"  points="1024,268 1024,1024 268,1024"/>
      <polygon mask="url(#m8)"  points="1024,292 1024,1024 292,1024"/>
      <polygon mask="url(#m10)" points="1024,316 1024,1024 316,1024"/>
      <polygon mask="url(#m12)" points="1024,340 1024,1024 340,1024"/>
      <polygon mask="url(#m14)" points="1024,364 1024,1024 364,1024"/>
      <polygon points="1024,388 1024,1024 388,1024"/>
    </g>
  </g>

  <!-- Loose cells lifting off the tail -->
  <g fill="#a5e1ee">
    <rect x="664" y="808" width="8" height="8" opacity=".9"/>
    <rect x="696" y="776" width="8" height="8" opacity=".7"/>
    <rect x="680" y="856" width="8" height="8" opacity=".5"/>
    <rect x="720" y="816" width="8" height="8" opacity=".4"/>
    <rect x="648" y="880" width="8" height="8" opacity=".3"/>
  </g>
</svg>