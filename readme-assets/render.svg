<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img"><title>Shared composition</title><desc>Frame sources and a timeline feed the Metal renderer. Audio mixing and rendering are shared by native preview and offline export; export overlaps GPU rendering and encoding.</desc><rect x="0" y="0" width="960" height="300" fill="#090909" rx="12"/><path d="M32 33h2v2h-2zM38 33h2v2h-2zM32 39h2v2h-2zM38 39h2v2h-2z" fill="#A7DFFF"/><path d="M35 33h2v2h-2zM32 36h2v2h-2zM35 36h2v2h-2zM35 39h2v2h-2z" fill="#1688FF"/><text x="47" y="41" fill="#A7DFFF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="500" text-anchor="start">04 / Render</text><text x="32" y="76" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" text-anchor="start">Two outputs. One composition.</text><text x="32" y="102" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Shared renderer + audio mix</text><rect x="32" y="140" width="238" height="65" fill="#121212" rx="7"/><path d="M46 155h2v2h-2zM52 155h2v2h-2zM46 161h2v2h-2zM52 161h2v2h-2z" fill="#A7DFFF"/><path d="M49 155h2v2h-2zM46 158h2v2h-2zM49 158h2v2h-2zM49 161h2v2h-2z" fill="#1688FF"/><text x="61" y="164" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Frame sources</text><text x="46" y="187" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Screen · camera · timeline</text><rect x="357" y="140" width="246" height="65" fill="#121212" rx="7"/><path d="M371 155h2v2h-2zM377 155h2v2h-2zM371 161h2v2h-2zM377 161h2v2h-2z" fill="#A7DFFF"/><path d="M374 155h2v2h-2zM371 158h2v2h-2zM374 158h2v2h-2zM374 161h2v2h-2z" fill="#1688FF"/><text x="386" y="164" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Metal + audio</text><text x="371" y="187" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Frame composition · mix</text><path d="M270 172L357 172" fill="none" stroke="#1688FF" stroke-width="1.5" stroke-linejoin="round"/><path d="M357 172l-6 -4v8z" fill="#1688FF"/><rect x="690" y="120" width="238" height="65" fill="#121212" rx="7"/><path d="M704 135h2v2h-2zM710 135h2v2h-2zM704 141h2v2h-2zM710 141h2v2h-2z" fill="#A7DFFF"/><path d="M707 135h2v2h-2zM704 138h2v2h-2zM707 138h2v2h-2zM707 141h2v2h-2z" fill="#1688FF"/><text x="719" y="144" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Preview</text><text x="704" y="167" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Latest-frame presentation</text><rect x="690" y="213" width="238" height="65" fill="#121212" rx="7"/><path d="M704 228h2v2h-2zM710 228h2v2h-2zM704 234h2v2h-2zM710 234h2v2h-2z" fill="#A7DFFF"/><path d="M707 228h2v2h-2zM704 231h2v2h-2zM707 231h2v2h-2zM707 234h2v2h-2z" fill="#1688FF"/><text x="719" y="237" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Export</text><text x="704" y="260" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">GPU / encoder overlap</text><path d="M603 162L650 162L650 152L690 152" fill="none" stroke="#A7DFFF" stroke-width="1.5" stroke-linejoin