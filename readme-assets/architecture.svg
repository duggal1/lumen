<svg xmlns="http://www.w3.org/2000/svg" width="960" height="744" viewBox="0 0 960 744" role="img"><title>Lumen architecture</title><desc>Logical runtime data flow. Capture writes a project bundle; analysis and director derive editable tracks. Preview and export share the renderer and audio mix. Native UI and agent control edit the same project.</desc><rect x="0" y="0" width="960" height="744" fill="#090909" rx="12"/><path d="M32 32h3v3h-3zM40 32h3v3h-3zM48 32h3v3h-3zM32 40h3v3h-3zM40 40h3v3h-3zM48 40h3v3h-3zM32 48h3v3h-3zM40 48h3v3h-3zM48 48h3v3h-3z" fill="#A7DFFF"/><path d="M36 32h3v3h-3zM44 32h3v3h-3zM32 36h3v3h-3zM36 36h3v3h-3zM44 36h3v3h-3zM48 36h3v3h-3zM36 40h3v3h-3zM44 40h3v3h-3zM36 44h3v3h-3zM44 44h3v3h-3zM36 48h3v3h-3zM44 48h3v3h-3z" fill="#1688FF"/><text x="60" y="44" fill="#A7DFFF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="500" text-anchor="start">01 / System</text><text x="32" y="88" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" text-anchor="start">One recording. One source of truth.</text><text x="32" y="114" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Logical runtime flow, not a Swift package dependency graph.</text><rect x="32" y="142" width="270" height="102" fill="#121212" rx="8"/><path d="M46 157h3v3h-3zM54 157h3v3h-3zM46 165h3v3h-3zM54 165h3v3h-3z" fill="#A7DFFF"/><path d="M50 157h3v3h-3zM46 161h3v3h-3zM50 161h3v3h-3zM50 165h3v3h-3z" fill="#1688FF"/><text x="66" y="168" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" text-anchor="start">Capture</text><text x="46" y="193" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-ancho