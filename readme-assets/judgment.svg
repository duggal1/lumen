<svg xmlns="http://www.w3.org/2000/svg" width="960" height="254" viewBox="0 0 960 254" role="img"><title>Product judgment</title><desc>Three explicit product choices: native macOS instead of a web wrapper, editable rather than baked-in direction, and focused recording instead of a general-purpose editor.</desc><rect x="0" y="0" width="960" height="254" fill="#090909" rx="12"/><path d="M32 33h2v2h-2zM38 33h2v2h-2zM32 39h2v2h-2zM38 39h2v2h-2z" fill="#A7DFFF"/><path d="M35 33h2v2h-2zM32 36h2v2h-2zM35 36h2v2h-2zM35 39h2v2h-2z" fill="#1688FF"/><text x="47" y="41" fill="#A7DFFF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="500" text-anchor="start">05 / Judgment</text><text x="32" y="76" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" text-anchor="start">Less, but better.</text><text x="32" y="102" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Three boundaries that keep the product focused.</text><path d="M32 137h3v3h-3zM40 137h3v3h-3zM48 137h3v3h-3zM56 137h3v3h-3zM64 137h3v3h-3zM72 137h3v3h-3zM32 145h3v3h-3zM40 145h3v3h-3zM48 145h3v3h-3zM56 145h3v3h-3zM64 145h3v3h-3zM72 145h3v3h-3z" fill="#A7DFFF"/><path d="M36 137h3v3h-3zM44 137h3v3h-3zM52 137h3v3h-3zM60 137h3v3h-3zM68 137h3v3h-3zM76 137h3v3h-3zM36 141h3v3h-3zM44 141h3v3h-3zM52 141h3v3h-3zM60 141h3v3h-3zM68 141h3v3h-3zM76 141h3v3h-3zM36 145h3v3h-3zM44 145h3v3h-3zM52 145h3v3h-3zM60 145h3v3h-3zM68 145h3v3h-3zM76 145h3v3h-3z" fill="#1688FF"/><text x="32" y="181" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Native macOS</text><text x="32" y="207" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Not a web wrapper</text><path d="M314 136L314 220" fill="none" stroke="#262626" stroke-width="1" stroke-linejoin="round"/><path d="M336 137h3v3h-3zM344 137h3v3h-3zM352 137h3v3h-3zM360 137h3v3h-3zM368 137h3v3h-3zM376 137h3v3h-3zM336 145h3v3h-3zM344 145h3v3h-3zM352 145h3v3h-3zM360 145h3v3h-3zM368 145h3v3h-3zM376 145h3v3h-3z" fill="#A7DFFF"/><path d="M340 137h3v3h-3zM348 137h3v3h-3zM356 137h3v3h-3zM364 137h3v3h-3zM372 137h3v3h-3zM380 137h3v3h-3zM340 141h3v3h-3zM348 141h3v3h-3zM356 141h3v3h-3zM364 141h3v3h-3zM372 141h3v3h-3zM380 141h3v3h-3zM340 145h3v3h-3zM348 145h3v3h-3zM356 145h3v3h-3zM364 145h3v3h-3zM372 145h3v3h-3zM380 145h3v3h-3z" fill="#1688FF"/><text x="336" y="181" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Editable direction</text><text x="336" y="207" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Not baked-in motion</text><path d="M618 136L618 220" fill="none" stroke="#262626" stroke-width="1" stroke-linejoin="round"/><path d="M640 137h3v3h-3zM648 137h3v3h-3zM656 137h3v3h-3zM664 137h3v3h-3zM672 137h3v3h-3zM680 137h3v3h-3zM640 145h3v3h-3zM648 145h3v3h-3zM656 145h3v3h-3zM664 145h3v3h-3zM672 145h3v3h-3zM680 145h3v3h-3z" fill="#A7DFFF"/><path d="M644 137h3v3h-3zM652 137h3v3h-3zM660 137h3v3h-3zM668 137h3v3h-3zM676 137h3v3h-3zM684 137h3v3h-3zM644 141h3v3h-3zM652 141h3v3h-3zM660 141h3v3h-3zM668 141h3v3h-3zM676 141h3v3h-3zM684 141h3v3h-3zM644 145h3v3h-3zM652 145h3v3h-3zM660 145h3v3h-3zM668 145h3v3h-3zM676 145h3v3h-3zM684 145h3v3h-3z" fill="#1688FF"/><text x="640" y="181" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Focused workflow</text><text x="640" y="207" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystem