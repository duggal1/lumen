name: Swift verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: swift-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: |
          swift --version
          xcodebuild -version
      - name: Check Metal compiler
        run: |
          xcode-select -p
          xcrun -sdk macosx metal --version
      - name: Build debug
        run: swift build
      - name: Provision reproducible integration fixtures
        run: |
          set -euo pipefail
          model="$HOME/Library/Application Support/Lumen/Models/moonshine-streaming-medium"
          mkdir -p "$model" .proof/visual
          base="https://download.moonshine.ai/model/medium-streaming-en/quantized_26_08_21"
          for file in adapter.ort cross_kv.ort decoder_kv.ort encoder.ort frontend.model.ort frontend.weights.ort streaming_config.json tokenizer.bin; do
            curl --fail --location --retry 3 --silent --show-error "$base/$file" -o "$model/$file"
            test -s "$model/$file"
          done
          command -v ffmpeg >/dev/null || brew install ffmpeg
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'testsrc2=size=480x270:rate=60:duration=1' -frames:v 60 -c:v libx264 -pix_fmt yuv420p .proof/visual/sequence.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of default=noprint_wrappers=1:nokey=1 .proof/visual/sequence.mp4)" = 60
      - name: Run unit and integration tests
        run: swift test --no-parallel
      - name: Build release and package app
        run: bash Tools/make-app.sh
      - name: Verify packaged audio and signature
        run: |
          codesign --verify --strict .build/Lumen.app
          test -f .build/Lumen.app/Contents/Resources/Sounds/manifest.json
          test -f .build/Lumen.app/Contents/Resources/Sounds/LICENSES.md
          for sound in crisp soft mechanical; do
            test -f ".build/Lumen.app/Contents/Resources/Audio/cursor-clicks/$sound.wav"
          done
          test -f .build/Lumen.app/Contents/Resources/Audio/music/credits.csv
          test ! -e .build/Lumen.app/Contents/Resources/Audio/mouse-click.mp3
          test ! -e .build/Lumen.app/Contents/Resources/Audio/new-click.mp3
          test ! -e .build/Lumen.app/Contents/Resources/Audio/touches
          python3 - <<'PY'
          import hashlib, json, pathlib, wave
          root = pathlib.Path(".build/Lumen.app/Contents/Resources/Sounds")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["sampleRate"] == 48000
          assert len(manifest["files"]) == 82
          assert {e["path"] for e in manifest["files"] if e["keyClass"] == "click"} == {"clicks/mouse-click-2.wav"}
          seen = set()
          for entry in manifest["files"]:
              path = root / entry["path"]
              assert path.is_file(), path
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == entry["sha256"], path
              assert digest not in seen, f"duplicate recording: {path}"
              seen.add(digest)
              assert entry["license"] == "CC0 1.0", path
              with wave.open(str(path)) as audio:
                  assert (audio.getframerate(), audio.getnchannels(), audio.getsampwidth()) == (48000, 1, 2), path
          print(f"verified {len(seen)} canonical 48 kHz recordings")
          PY
