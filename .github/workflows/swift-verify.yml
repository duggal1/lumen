name: Swift verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: swift-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: |
          swift --version
          xcodebuild -version
      - name: Check Metal compiler
        run: |
          xcode-select -p
          xcrun -sdk macosx metal --version
      - name: Build debug
        run: swift build
      - name: Run unit and integration tests
        run: swift test --no-parallel
      - name: Build release and package app
        run: bash Tools/make-app.sh
      - name: Verify packaged audio and signature
        run: |
          codesign --verify --strict .build/Lumen.app
          test -f .build/Lumen.app/Contents/Resources/Audio/mouse-click.mp3
          for sound in crisp soft mechanical release snap tick light tap; do
            test -f ".build/Lumen.app/Contents/Resources/Audio/cursor-clicks/$sound.wav"
          done
          test -f .build/Lumen.app/Contents/Resources/Audio/music/credits.csv
