name: Swift verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: swift-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: |
          swift --version
          xcodebuild -version
      - name: Install Metal toolchain
        run: |
          xcode-select -p
          # Xcode 16 ships the `metal` driver but not the compiler component on
          # the hosted runners. Without it SwiftPM copies Shaders.metal as a
          # resource and the renderer fails with "no default library was found".
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal -v
      - name: Build debug
        run: swift build
      - name: Run unit and integration tests
        run: swift test
      - name: Build release and package app
        run: bash Tools/make-app.sh
      - name: Verify packaged audio and signature
        run: |
          codesign --verify --strict .build/Lumen.app
          test -f .build/Lumen.app/Contents/Resources/Audio/mouse-click.mp3
          test -f .build/Lumen.app/Contents/Resources/Audio/zoom-in-whoosh.mp3
          test -f .build/Lumen.app/Contents/Resources/Audio/music/credits.csv
