<!-- Lumen calibration fixture. No network. Visible "test fixture" label. -->
<!doctype html><html><head><meta charset="utf-8"><title>Acme — test fixture</title>
<style>body{margin:0;font:16px system-ui} .tag{position:fixed;top:8px;left:12px;color:#888}
#input{width:600px;height:48px;font:28px monospace}
#scroll{height:1200px;background:repeating-linear-gradient(#fff 0 100px,#eee 100px 200px)}</style></head>
<body>
<p class="tag">test fixture — no real data</p>
<p><input id="input" placeholder="type here"></p>
<div id="scroll"></div>
<script>
(function(){
  // Click marker: 28x28 pure magenta square centred on the click, fading after 1s.
  addEventListener('mousedown', function(ev){
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;z-index:99;width:28px;height:28px;background:#FF00FF;left:'+(ev.clientX-14)+'px;top:'+(ev.clientY-14)+'px';
    document.body.appendChild(d);
    setTimeout(function(){ d.style.transition='opacity 1s'; d.style.opacity='0'; setTimeout(function(){d.remove();},1000); },1000);
  });
  // Typing caret bar: 6x32 magenta bar at the caret position.
  var input = document.getElementById('input');
  var mirror = document.createElement('span');
  mirror.style.cssText = 'position:absolute;visibility:hidden;font:28px monospace';
  document.body.appendChild(mirror);
  var bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;z-index:99;width:6px;height:32px;background:#FF00FF;display:none';
  document.body.appendChild(bar);
  input.addEventListener('input', function(){
    mirror.textContent = input.value;
    var r = input.getBoundingClientRect();
    bar.style.display = 'block';
    bar.style.left = (r.left + mirror.getBoundingClientRect().width) + 'px';
    bar.style.top = (r.top + 8) + 'px';
  });
  input.addEventListener('blur', function(){ bar.style.display = 'none'; });
})();
</script>
</body></html>
